<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>პორტფოლიო | მთავარი</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="script.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo">MyPortfolio</div>
        <nav class="nav-links">
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="about" class="glass-card profile-container">
            <img src="https://via.placeholder.com/150" alt="Profile" class="profile-img">
            <div class="profile-text">
                <h1>Hello, I am [Your Name]</h1>
                <p>Frontend developer creating modern and user-centric websites.</p>
            </div>
        </section>

        <section id="services" class="services-container">
    <div class="service-box">
        <i data-lucide="code-2" class="icon"></i>
        <h3>Web Development</h3>
        <p>Creating modern, responsive, and high-performance websites.</p>
    </div>

    <div class="service-box">
        <i data-lucide="box" class="icon"></i>
        <h3>3D Visualization</h3>
        <p>Creating realistic 3D product models and immersive visualizations.</p>
    </div>
</section>
    </main>

    <script>
      lucide.createIcons();
    </script>
</body>
</html>
